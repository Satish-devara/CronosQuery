apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronos-backend-deployment
  labels:
    app: chronos-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chronos-backend
  template:
    metadata:
      labels:
        app: chronos-backend
    spec:
      containers:
        - name: chronos-backend
          image: chronos-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "host.minikube.internal"
            - name: REDIS_HOST
              value: "host.minikube.internal"
            - name: KAFKA_HOST
              value: "host.minikube.internal"
---
apiVersion: v1
kind: Service
metadata:
  name: chronos-backend-service
spec:
  type: NodePort
  selector:
    app: chronos-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080